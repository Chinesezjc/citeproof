[project]
name = "citeproof"
version = "0.1.0"
description = "Audit the citations in AI-drafted legal documents: detect fabricated cases, wrong reporter citations, and fabricated quotations."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "eyecite>=2.6",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "backend" }
packages = ["citeproof"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
